[project]
name = "ptcgp-fetcher"
version = "0.1.0"
description = "PTCGP 卡牌图片爬虫 - 高性能异步下载"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9.0",
  "aiodns>=3.0.0",
  "aiofiles>=23.0.0",
  "tenacity>=8.2.0",
  "tqdm>=4.66.0",
  "Pillow>=10.0.0",
  "unitypy>=1.23.0",
  # generate_hashes.py 感知哈希所需
  "numpy>=1.26.0",
  "scipy>=1.11.0",
]

[project.scripts]
fetch-cards = "fetch_cards:main"
